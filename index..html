<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Sạch</title>
<!-- DÁN THẺ META XÁC MINH TÊN MIỀN CỦA ZALO VÀO ĐÂY (nếu Zalo yêu cầu dùng thẻ meta) -->
<style>
  body{font-family:Arial,sans-serif;background:#f6f1e7;margin:0;padding:24px;text-align:center;color:#2b2b2b}
  .box{max-width:420px;margin:40px auto;background:#fff;border-radius:16px;padding:28px 22px;box-shadow:0 2px 12px rgba(0,0,0,.08)}
  h2{margin:0 0 12px;color:#2e7d32}
  .btn{display:block;width:100%;margin:20px 0 14px;padding:16px;background:#0068ff;color:#fff;border:0;font-size:18px;font-weight:bold;border-radius:12px;cursor:pointer}
  .note{font-size:12px;color:#777;line-height:1.5}
</style>
</head>
<body>
<div class="box">
  <h2>Xin chào!</h2>
  <p>Bấm nút bên dưới để xác nhận bạn đã ghé <b>9 Sạch</b> và nhận ưu đãi.</p>
  <button class="btn" id="btn">Check bằng Zalo</button>
  <p class="note">Khi bấm, bạn đồng ý để 9 Sạch lưu <b>tên và ảnh đại diện Zalo</b>
  nhằm mục đích chăm sóc khách hàng. Bạn có thể yêu cầu xóa dữ liệu bất cứ lúc nào.</p>
</div>

<script>
// ====== SỬA 2 DÒNG NÀY ======
const APP_ID   = 'DÁN_ZALO_APP_ID_VÀO_ĐÂY';
const CALLBACK = 'https://USERNAME.github.io/callback.html'; // phải KHỚP 100% với Callback URL khai báo trên Zalo
// =============================

function randHex(n){
  const a = new Uint8Array(n/2); crypto.getRandomValues(a);
  return Array.from(a, b => b.toString(16).padStart(2,'0')).join('');
}
async function challengeOf(verifier){
  const d = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier));
  return btoa(String.fromCharCode(...new Uint8Array(d)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

document.getElementById('btn').addEventListener('click', async function(){
  const src = (new URLSearchParams(location.search).get('src') || 'DEFAULT').slice(0,50);
  const verifier = randHex(64);
  const state = randHex(32);
  const challenge = await challengeOf(verifier);

  localStorage.setItem('zl_' + state, JSON.stringify({ v: verifier, src: src, t: Date.now() }));

  location.href = 'https://oauth.zaloapp.com/v4/permission'
    + '?app_id=' + encodeURIComponent(APP_ID)
    + '&redirect_uri=' + encodeURIComponent(CALLBACK)
    + '&code_challenge=' + challenge
    + '&state=' + state;
});
</script>
</body>
</html>
