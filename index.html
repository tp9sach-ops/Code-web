<script>
/* Một số mạng chặn cdnjs — thử lần lượt nhiều nguồn CDN dự phòng. */
function loadScriptWithFallback_(urls, onDone) {
  var i = 0;
  function tryNext() {
    if (i >= urls.length) { onDone(false); return; }
    var s = document.createElement('script');
    s.src = urls[i];
    var timeout = setTimeout(function () { i++; tryNext(); }, 7000);
    s.onload = function () { clearTimeout(timeout); onDone(true); };
    s.onerror = function () { clearTimeout(timeout); i++; tryNext(); };
    document.head.appendChild(s);
  }
  tryNext();
}
</script>
<script>
/* CẤU HÌNH DUY NHẤT CẦN SỬA khi triển khai (nằm ngay đầu file index.html).
 * Dán URL Web App của Google Apps Script (kết thúc bằng /exec) vào apiUrl.
 * Lấy ở: Apps Script → Triển khai → Quản lý triển khai → Ứng dụng web → URL.
 */
window.NV_CONFIG = {
  apiUrl: 'https://script.google.com/macros/s/AKfycbz5YhEpWfQKmOyhBpi61rtlbTxLuPoglg15mLMZ33mwqcOq23ZAuNe1K-QrlswS_uoaCg/exec',
  timeoutMs: 60000,        // quá thời gian này coi như mất kết nối (tải ảnh được cộng thêm)
  uploadTimeoutMs: 120000, // riêng nvUploadAnh
  warmUp: true             // gọi ping khi mở trang để Apps Script "thức dậy" sớm
};
</script>
<script>
/* api.js — cầu nối giữa giao diện và Google Apps Script.
 * Giao diện cũ gọi:  google.script.run.withSuccessHandler(f).withFailureHandler(g).nvLogin(u, p)
 * File này dựng lại đúng cú pháp đó nhưng gửi bằng fetch tới URL Web App (POST JSON, text/plain
 * để tránh bước kiểm tra CORS preflight mà Apps Script không hỗ trợ).
 * Nhờ vậy toàn bộ code giao diện (hàm call(...)) chạy nguyên vẹn trên Vercel.
 * KHÔNG tự động gửi lại (retry) — giao diện đã tự xử lý mất mạng/xung đột phiên bản.
 */
(function (w) {
  'use strict';
  var CFG = w.NV_CONFIG || {};
  var URL_ = String(CFG.apiUrl || '');

  function configured() { return /^https:\/\/script\.google(usercontent)?\.com\//.test(URL_) || /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(URL_); }

  function humanError(err) {
    var m = err && err.message ? String(err.message) : '';
    if (err && err.name === 'AbortError') return 'Quá thời gian chờ máy chủ.';
    if (err && err.name === 'TypeError') return 'Không có mạng hoặc máy chủ không phản hồi.';
    return m || 'Lỗi không xác định.';
  }

  function post(fn, args) {
    if (!configured()) return Promise.reject(new Error('Chưa cấu hình địa chỉ máy chủ (public/index.html → khối NV_CONFIG → apiUrl).'));
    var ctrl = typeof AbortController !== 'undefined' ? new AbortController() : null;
    var ms = fn === 'nvUploadAnh' ? (CFG.uploadTimeoutMs || 120000) : (CFG.timeoutMs || 60000);
    var timer = ctrl ? setTimeout(function () { ctrl.abort(); }, ms) : 0;
    return fetch(URL_, {
      method: 'POST',
      redirect: 'follow',
      credentials: 'omit',
      cache: 'no-store',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args }),
      signal: ctrl ? ctrl.signal : undefined
    }).then(function (res) {
      if (!res.ok) throw new Error('Máy chủ trả mã ' + res.status + '.');
      return res.text();
    }).then(function (txt) {
      clearTimeout(timer);
      try { return JSON.parse(txt); }
      catch (e) { throw new Error('Phản hồi máy chủ không đúng định dạng (kiểm tra quyền "Bất kỳ ai" của Web App).'); }
    }, function (err) { clearTimeout(timer); throw err; });
  }

  function makeRunner(onOk, onFail) {
    var base = {
      withSuccessHandler: function (f) { return makeRunner(f, onFail); },
      withFailureHandler: function (g) { return makeRunner(onOk, g); }
    };
    return new Proxy(base, {
      get: function (t, name) {
        if (name in t) return t[name];
        if (typeof name !== 'string' || name === 'then') return undefined;
        return function () {
          var args = Array.prototype.slice.call(arguments);
          post(name, args).then(
            function (r) { if (onOk) onOk(r); },
            function (err) { if (onFail) onFail({ message: humanError(err) }); }
          );
        };
      }
    });
  }

  w.google = w.google || {};
  w.google.script = w.google.script || {};
  w.google.script.run = makeRunner(null, null);

  /* Làm nóng Apps Script (khởi động nguội mất 1–3 giây) */
  if (CFG.warmUp !== false && configured()) {
    try { fetch(URL_ + (URL_.indexOf('?') < 0 ? '?' : '&') + 'fn=ping', { cache: 'no-store', credentials: 'omit' }).catch(function () {}); } catch (e) {}
  }

  w.NV_API = { post: post, configured: configured };
})(window);
</script>

<style>
:root{
  --forest:#0a2a1c; --forest-2:#0f3d28; --leaf:#146c43; --emerald:#1f9d55; --emerald-2:#17b866;
  --mint:#e6f7ee; --mint-2:#d1f0e0; --gold:#eab308; --gold-soft:#fff6da;
  --bg:#f3f6f4; --surface:#fff; --surface-2:#fafcfb;
  --red:#dc2626; --red-soft:#fdeceb; --amber:#ea580c; --amber-soft:#fff1e6; --sky:#0284c7; --sky-soft:#e7f6fd;
  --text:#132018; --muted:#5c6b63; --border:#e1e9e4;
  --radius:16px; --radius-sm:10px;
  --shadow-sm:0 1px 3px rgba(15,45,30,.07),0 1px 2px rgba(15,45,30,.05);
  --shadow-md:0 6px 20px rgba(15,45,30,.10); --shadow-lg:0 16px 40px rgba(15,45,30,.18);
  --ease:cubic-bezier(.22,.9,.35,1);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{font-family:'Be Vietnam Pro',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;overflow-x:hidden;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--text);}
.hide{display:none!important;}
.muted{color:var(--muted);} .tiny{font-size:11.5px;} .b{font-weight:700;}
.red{color:var(--red);} .green{color:var(--leaf);} .amber{color:var(--amber);}

/* ---------- splash / login ---------- */
.full{position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 800px at 15% 10%,#12492f 0%,transparent 55%),linear-gradient(150deg,var(--forest),var(--forest-2) 55%,#0c3322);}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,var(--emerald),var(--emerald-2));display:flex;align-items:center;justify-content:center;color:#fff;font-size:28px;box-shadow:var(--shadow-md);}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp .8s linear infinite;margin-top:22px;}
@keyframes sp{to{transform:rotate(360deg);}}
#splash{flex-direction:column;z-index:990;}
#login{z-index:980;padding:20px;}
.lcard{background:#fff;border-radius:22px;padding:30px 24px 24px;width:100%;max-width:360px;box-shadow:var(--shadow-lg);animation:cardIn .5s var(--ease);}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:1;transform:none;}}
.lcard h2{margin:14px 0 2px;font-size:22px;color:var(--forest);} .lcard p{margin:0 0 18px;color:var(--muted);font-size:13px;}
.field{position:relative;margin-bottom:12px;}
.field i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);}
.field input{width:100%;height:48px;border:1.5px solid var(--border);border-radius:12px;padding:0 14px 0 40px;background:var(--surface-2);outline:none;}
.field input:focus{border-color:var(--emerald);background:#fff;}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px;}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border:0;border-radius:12px;font-weight:700;font-size:14.5px;background:var(--mint);color:var(--leaf);transition:transform .12s var(--ease),opacity .2s;}
.btn:active{transform:scale(.97);} .btn[disabled]{opacity:.5;pointer-events:none;}
.btn.pri{background:linear-gradient(135deg,var(--emerald),var(--leaf));color:#fff;box-shadow:0 4px 12px rgba(31,157,85,.35);}
.btn.gold{background:var(--gold);color:#3b2f00;} .btn.red{background:var(--red);color:#fff;} .btn.ghost{background:#fff;border:1.5px solid var(--border);color:var(--text);}
.btn.block{width:100%;} .btn.sm{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px;}
.ib{width:42px;height:42px;border-radius:12px;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:16px;}

/* ---------- app shell ---------- */
#app{display:none;min-height:100%;padding-bottom:calc(74px + var(--sab));}
.top{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;padding:calc(10px + var(--sat)) 16px 12px;display:flex;align-items:center;gap:12px;}
.top .logo{width:38px;height:38px;border-radius:12px;font-size:18px;box-shadow:none;}
.top .ttl{flex:1;min-width:0;} .top .ttl b{display:block;font-size:15.5px;} .top .ttl small{opacity:.75;font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto;}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#fff;border-top:1px solid var(--border);padding-bottom:var(--sab);box-shadow:0 -4px 16px rgba(15,45,30,.06);}
.nav-in{display:flex;max-width:720px;margin:0 auto;}
.nav button{flex:1;border:0;background:none;padding:9px 4px 8px;color:var(--muted);font-size:11.5px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:56px;}
.nav button i{font-size:19px;} .nav button.on{color:var(--leaf);} .nav button.on i{color:var(--emerald);}

.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px;border:1px solid var(--border);}
.card h3{margin:0 0 10px;font-size:14.5px;display:flex;align-items:center;gap:8px;} .card h3 i{color:var(--emerald);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:11.5px;font-weight:700;background:#eef2ef;color:var(--muted);white-space:nowrap;}
.badge.g{background:var(--mint);color:var(--leaf);} .badge.y{background:var(--gold-soft);color:#8a6a00;} .badge.r{background:var(--red-soft);color:var(--red);} .badge.s{background:var(--sky-soft);color:var(--sky);} .badge.o{background:var(--amber-soft);color:var(--amber);}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none;} .chips::-webkit-scrollbar{display:none;}
.chip{flex:0 0 auto;border:1.5px solid var(--border);background:#fff;border-radius:99px;padding:8px 14px;font-weight:600;font-size:13px;color:var(--muted);min-height:38px;}
.chip.on{background:var(--forest);border-color:var(--forest);color:#fff;}
.chip small{display:block;font-weight:500;font-size:10.5px;opacity:.8;}

.shift{display:flex;gap:12px;align-items:center;width:100%;text-align:left;border:1px solid var(--border);background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
.shift .ico{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;flex:0 0 auto;}
.shift.sang .ico{background:var(--gold-soft);color:var(--gold);} .shift.toi .ico{background:#e8eaf8;color:#4f46e5;}
.shift .mid{flex:1;min-width:0;} .shift .mid b{font-size:16px;display:block;} .shift .mid span{font-size:12px;color:var(--muted);}
.notice{border-radius:12px;padding:11px 14px;font-size:13px;margin-bottom:12px;display:flex;gap:10px;align-items:flex-start;}
.notice.warn{background:var(--amber-soft);color:#9a3412;} .notice.bad{background:var(--red-soft);color:#991b1b;} .notice.info{background:var(--sky-soft);color:#075985;} .notice.good{background:var(--mint);color:var(--leaf);}

/* ---------- ca screen ---------- */
#ca{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column;}
.ca-top{background:linear-gradient(135deg,var(--forest),var(--forest-2));color:#fff;padding:calc(8px + var(--sat)) 12px 10px;flex:0 0 auto;}
.ca-row{display:flex;align-items:center;gap:10px;} .ca-row .t{flex:1;min-width:0;} .ca-row .t b{display:block;font-size:15px;} .ca-row .t small{opacity:.8;font-size:11.5px;display:block;}
.steps{display:flex;gap:4px;margin-top:9px;} .steps button{flex:1;border:0;height:30px;border-radius:8px;background:rgba(255,255,255,.14);color:rgba(255,255,255,.75);font-size:11px;font-weight:700;padding:0;}
.steps button.on{background:var(--gold);color:#3b2f00;} .steps button.done{background:var(--emerald);color:#fff;}
.savest{font-size:11.5px;opacity:.9;margin-top:6px;display:flex;align-items:center;gap:6px;}
.ca-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 24px;}
.ca-bot{flex:0 0 auto;background:#fff;border-top:1px solid var(--border);padding:8px 12px calc(10px + var(--sab));box-shadow:0 -4px 16px rgba(15,45,30,.07);}
.tot{display:flex;gap:6px;margin-bottom:8px;} .tot div{flex:1;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:5px 8px;min-width:0;}
.tot small{display:block;font-size:10.5px;color:var(--muted);} .tot b{font-size:13.5px;white-space:nowrap;}
.navbtns{display:flex;gap:8px;} .navbtns .btn{flex:1;}

.grp{font-size:12px;font-weight:800;color:var(--leaf);text-transform:uppercase;letter-spacing:.4px;margin:14px 2px 6px;}
.rc{background:#fff;border:1px solid var(--border);border-radius:14px;padding:10px 10px 8px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.rc.neg{border-color:var(--red);background:var(--red-soft);}
.rc-h{display:flex;align-items:center;gap:8px;margin-bottom:7px;} .rc-h b{flex:1;font-size:13.5px;min-width:0;} .rc-h .x{border:0;background:none;color:var(--red);font-size:15px;padding:4px 8px;}
.tc{font-weight:800;font-size:13px;background:var(--mint);color:var(--leaf);padding:3px 10px;border-radius:99px;white-space:nowrap;} .tc.neg{background:var(--red);color:#fff;}
.rc-g{display:grid;gap:6px;} .rc-g.g5{grid-template-columns:repeat(5,1fr);} .rc-g.g4{grid-template-columns:repeat(4,1fr);}
.rc-g label{font-size:10px;font-weight:700;color:var(--muted);display:block;text-align:center;}
.rc-g input{width:100%;height:42px;border:1.5px solid var(--border);border-radius:10px;text-align:center;font-weight:700;background:var(--surface-2);outline:none;padding:0 2px;font-size:16px;}
.rc-g input:focus{border-color:var(--emerald);background:#fff;}
.rc-g input.kd{background:var(--sky-soft);}
.rc .chl{font-size:11.5px;margin-top:5px;} .rc .reason{margin-top:6px;}
.reason input,.txt{width:100%;border:1.5px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;background:var(--surface-2);min-height:42px;}
.reason input{border-color:var(--amber);background:var(--amber-soft);font-size:14px;}
textarea.txt{min-height:64px;resize:vertical;}
.addrow{display:flex;gap:8px;margin:10px 0;}

.line{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);} .line:last-child{border:0;}
.line .m{flex:1;min-width:0;} .line .m b{display:block;font-size:13.5px;} .line .m span{font-size:12px;color:var(--muted);display:block;overflow:hidden;text-overflow:ellipsis;}
.line .v{font-weight:800;white-space:nowrap;} .line img{width:38px;height:38px;border-radius:8px;object-fit:cover;border:1px solid var(--border);}
.line .act button{border:0;background:var(--mint);color:var(--leaf);width:34px;height:34px;border-radius:9px;margin-left:4px;}
.line .act button.d{background:var(--red-soft);color:var(--red);}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;} .fgrid .full2{grid-column:1/-1;}
.fl{display:block;} .fl>span{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:4px;}
.fl>span em{font-style:normal;color:var(--amber);font-weight:600;font-size:10.5px;margin-left:4px;}
.mi{width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;padding:0 12px;text-align:right;font-weight:700;background:var(--surface-2);outline:none;}
.mi:focus,.sel:focus{border-color:var(--emerald);background:#fff;}
.sel{width:100%;height:46px;border:1.5px solid var(--border);border-radius:12px;padding:0 10px;background:var(--surface-2);outline:none;}
.hint{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.4;}
.photo{display:flex;align-items:center;gap:10px;} .photo img{width:64px;height:64px;border-radius:10px;object-fit:cover;border:1px solid var(--border);}
.photo .ph{width:64px;height:64px;border-radius:10px;background:var(--surface-2);border:1.5px dashed var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;}
.seg{display:flex;gap:6px;flex-wrap:wrap;} .seg button{flex:1;min-width:30%;border:1.5px solid var(--border);background:#fff;border-radius:10px;padding:9px 6px;font-size:12.5px;font-weight:600;color:var(--muted);min-height:42px;}
.seg button.on{background:var(--mint);border-color:var(--emerald);color:var(--leaf);}

.sumg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px;} .sumg div{background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px 12px;} .sumg small{color:var(--muted);font-size:11px;display:block;} .sumg b{font-size:16px;}
.chk{background:#fff;border:1px solid var(--border);border-radius:14px;padding:11px 12px;margin-bottom:8px;} .chk.bad{border-color:#f5b5b1;background:#fffafa;}
.chk-h{display:flex;gap:8px;align-items:flex-start;} .chk-h i{margin-top:3px;} .chk-h b{flex:1;font-size:13.5px;}
.chk .nums{font-size:12px;color:var(--muted);margin:4px 0 0 24px;} .chk .why{font-size:12.5px;color:#7f1d1d;margin:6px 0 0 24px;line-height:1.5;}
.chk textarea{margin-top:8px;}

/* ---------- sheet / modal / toast ---------- */
#ov{position:fixed;inset:0;background:rgba(10,30,20,.5);z-index:400;display:none;}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:410;background:#fff;border-radius:22px 22px 0 0;max-height:90%;display:none;flex-direction:column;box-shadow:var(--shadow-lg);animation:up .28s var(--ease);padding-bottom:var(--sab);max-width:720px;margin:0 auto;}
@keyframes up{from{transform:translateY(30px);opacity:0;}to{transform:none;opacity:1;}}
#sheet .hd{padding:14px 16px 8px;display:flex;align-items:center;gap:10px;} #sheet .hd b{flex:1;font-size:16px;} #sheet .hd button{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;}
#sheetBody{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch;} #sheetFoot{padding:8px 16px 12px;border-top:1px solid var(--border);display:flex;gap:8px;}
#modal{position:fixed;inset:0;z-index:500;background:rgba(10,30,20,.55);display:none;align-items:center;justify-content:center;padding:20px;}
.mbox{background:#fff;border-radius:18px;padding:20px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);} .mbox h4{margin:0 0 8px;font-size:16px;} .mbox p{margin:0 0 16px;color:var(--muted);font-size:13.5px;line-height:1.5;} .mbox .row{display:flex;gap:8px;}
#toast{position:fixed;left:50%;bottom:calc(90px + var(--sab));transform:translateX(-50%);z-index:600;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:92%;max-width:420px;}

.mb{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:10px;color:var(--muted);flex:0 0 auto;}

.stp.g>div{border-color:#bfe8d1;} .stp.y>div{border-color:#f3d36b;background:var(--gold-soft);} .stp.y button{color:#8a6a00;}
.stp>div:focus-within{border-color:var(--emerald);background:#fff;}

.empty{text-align:center;padding:24px 10px;color:var(--muted);font-size:13px;} .empty i{font-size:34px;color:var(--mint-2);margin-bottom:8px;display:block;}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px;}
.tile{border:1.5px solid var(--border);background:#fff;border-radius:12px;padding:10px;text-align:left;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;min-height:48px;color:var(--text);}

@keyframes shim{to{background-position:-200% 0;}}

/* ---------- sổ ---------- */
.so-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.so-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:12px;-webkit-overflow-scrolling:touch;}

.lv:last-child{border:0;} .lv i{margin-top:3px;} .lv .d{margin-left:auto;font-weight:800;white-space:nowrap;}

.sym{display:inline-block;min-width:26px;text-align:center;font-weight:800;color:var(--leaf);background:var(--mint);border-radius:8px;padding:1px 6px;font-size:12px;margin-right:6px;}
</style>
<style>
/* ===== GIAO DIỆN MỚI — cùng phong cách app chấm công ===== */
:root{--forest:#0c3626;--forest-2:#17503a;--leaf:#238a58;--emerald:#238a58;--emerald-2:#2fa86b;--mint:#e2f1e8;--mint-2:#cfe8da;--gold:#f4b72c;--gold-soft:#fff1c9;--bg:#f1f5f1;--border:#e2e9e3;--shadow-sm:0 4px 16px rgba(12,54,38,.07);}

.nav .nb{position:absolute;top:2px;left:calc(50% + 8px);background:#c8423b;color:#fff;border-radius:9px;font-size:11px;min-width:18px;height:18px;line-height:18px;text-align:center;padding:0 5px;border:2px solid #fff;}

.ps-f.t>div{border-color:#b9d3f5;background:#eef4fd;}.ps-f.b>div{border-color:#f3d36b;background:var(--gold-soft);}
.ps-f.x>div{border-color:#e3b9b5;background:#fdf0ef;}.ps-f.n>div{border-color:#bfe8d1;background:var(--mint);}

.tcl{background:#fff;border-radius:22px;box-shadow:var(--shadow-sm);padding:14px;margin-bottom:12px;}

.tgt:active{transform:scale(.97);}

.tgd{border-radius:18px;background:var(--cs);padding:12px;margin-bottom:12px;}

.ql-line{border-top:1px solid var(--border);padding:10px 0;}

</style>

<script>
/* =====================================================================
   9 SẠCH — KẾT CA NHÂN VIÊN  (client)
   ===================================================================== */
var S = { token: null, user: '', role: '', store: '', readOnly: false, today: '', minNgay: '', mapso: [], statuses: {}, ngay: '', tab: 'home',
  day: {}, prices: {}, catalog: null, catAt: 0, cur: null, step: 1, stores: [], adminStore: '', soCa: 'Sáng', build: '', dayP: {}, dayAt: {}, dayBg: {}, openTk: null, addNhom: 'BANH' };
var AUTH_KEY = 'nv9s_auth_v1';
var CA = ['Sáng', 'Tối'];
var $ = function (id) { return document.getElementById(id); };

/* ---------- tiện ích ---------- */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function num(v) { if (typeof v === 'number') return isFinite(v) ? v : 0; var n = parseFloat(String(v == null ? '' : v).replace(/[^\d.\-]/g, '')); return isFinite(n) ? n : 0; }
function fmt(n) { if (n === '' || n == null || isNaN(n)) return ''; n = Math.round(n); var neg = n < 0; return (neg ? '-' : '') + String(Math.abs(n)).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function fmtD(n) { return fmt(n) + 'đ'; }
function r2(n) { return Math.round((n || 0) * 100) / 100; }
function kcMatch(a, b) { return Math.abs((parseFloat(a) || 0) - (parseFloat(b) || 0)) <= 1000; }
function dmy(n) { var p = String(n).split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
function dm(n) { var p = String(n).split('-'); return p[2] + '/' + p[1]; }
function addDays(ngay, k) { var p = ngay.split('-'); var d = new Date(Date.UTC(+p[0], +p[1] - 1, +p[2] + k)); return d.toISOString().slice(0, 10); }
function mv(v) { return (v === '' || v == null) ? '' : fmt(num(v)); }
function safeMuc(code) { return 'SP_' + String(code).replace(/[^A-Za-z0-9_\-]/g, '_').slice(0, 55); }
function thumb(url) { var m = /[?&]id=([^&]+)/.exec(url || ''); return m ? 'https://drive.google.com/thumbnail?id=' + m[1] + '&sz=w240' : (url || ''); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
/* ô tiền: tách nghìn kiểu vi-VN, giữ vị trí con trỏ; trả về chuỗi chữ số */
function moneyIn(el) {
  var v = el.value, caret = el.selectionStart || 0, before = v.slice(0, caret).replace(/\D/g, '').length;
  var digits = v.replace(/\D/g, '').replace(/^0+(?=\d)/, '');
  var out = digits ? digits.replace(/\B(?=(\d{3})+(?!\d))/g, '.') : '';
  el.value = out;
  var pos = 0, cnt = 0;
  if (before > 0) { for (pos = 0; pos < out.length; pos++) { if (/\d/.test(out[pos])) cnt++; if (cnt === before) { pos++; break; } } }
  try { el.setSelectionRange(pos, pos); } catch (e) {}
  return digits;
}
function qtyIn(el) { var d = el.value.replace(/\D/g, '').replace(/^0+(?=\d)/, ''); if (el.value !== d) el.value = d; return d; }

function toast(msg, isErr) {
  var d = document.createElement('div'); d.className = 'tst' + (isErr ? ' e' : ''); d.textContent = msg; $('toast').appendChild(d);
  setTimeout(function () { d.style.opacity = '0'; d.style.transition = 'opacity .3s'; }, isErr ? 4200 : 2200); setTimeout(function () { d.remove(); }, isErr ? 4600 : 2600);
}
function busy(on, txt) { $('busy').style.display = on ? 'flex' : 'none'; if (txt) $('busyTxt').textContent = txt; }
function openSheet(title, body, foot) {
  $('sheetTitle').textContent = title; $('sheetBody').innerHTML = body;
  var f = $('sheetFoot'); if (foot) { f.innerHTML = foot; f.classList.remove('hide'); } else { f.innerHTML = ''; f.classList.add('hide'); }
  $('ov').style.display = 'block'; $('sheet').style.display = 'flex'; $('sheetBody').scrollTop = 0;
}
function closeSheet() { $('ov').style.display = 'none'; $('sheet').style.display = 'none'; }
function modal(html) { $('modalBox').innerHTML = html; $('modal').style.display = 'flex'; }
function closeModal() { $('modal').style.display = 'none'; }
var _mcb = null;
function confirmBox(title, msg, okText, onOk, cancelText) {
  _mcb = onOk;
  modal('<h4>' + esc(title) + '</h4><p>' + msg + '</p><div class="row"><button class="btn ghost" style="flex:1" onclick="closeModal()">' + esc(cancelText || 'Hủy') +
    '</button><button class="btn pri" style="flex:1" onclick="closeModal();_mcb&&_mcb()">' + esc(okText || 'Đồng ý') + '</button></div>');
}
function alertBox(title, msg) { modal('<h4>' + esc(title) + '</h4><p>' + msg + '</p><button class="btn pri block" onclick="closeModal()">Đã hiểu</button>'); }

/* ---------- gọi server ---------- */
function call(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return new Promise(function (resolve) {
    try {
      var run = google.script.run
        .withSuccessHandler(function (r) { resolve(r || { success: false, message: 'Máy chủ không phản hồi.' }); })
        .withFailureHandler(function (e) { resolve({ success: false, network: true, message: 'Mất kết nối máy chủ. ' + ((e && e.message) || '') }); });
      run[fn].apply(run, args);
    } catch (e) { resolve({ success: false, network: true, message: 'Không gọi được máy chủ.' }); }
  });
}

/* ---------- đăng nhập / khởi động ---------- */
function showLogin(msg) { $('splash').classList.add('hide'); $('login').classList.remove('hide'); $('lErr').textContent = msg || ''; setTimeout(function () { $('lUser').focus(); }, 100); }
function hideLogin() { $('login').classList.add('hide'); }
function doLogin() {
  var u = $('lUser').value.trim(), p = $('lPass').value;
  if (!u || !p) { $('lErr').textContent = 'Vui lòng nhập đủ tài khoản và mật khẩu.'; return; }
  var b = $('lBtn'); b.disabled = true; $('lErr').textContent = '';
  call('nvLogin', u, p).then(function (r) {
    b.disabled = false;
    if (!r.success) { $('lErr').textContent = r.message; return; }
    S.token = r.data.token; S.user = r.data.username; S.role = r.data.role;
    lsSet(AUTH_KEY, JSON.stringify({ token: S.token, user: S.user, role: S.role }));
    $('lPass').value = '';
    hideLogin(); if (S.cur || BG.length) { toast('Đã đăng nhập lại — đang đồng bộ bản nháp…'); flushBg(); } if (!S.cur) boot();
  });
}
function handleExpired(msg) { showLogin(msg || 'Phiên đăng nhập đã hết hạn. Hãy đăng nhập lại — bản nháp vẫn được giữ.'); }
function logout() {
  confirmBox('Đăng xuất?', 'Bản nháp chưa gửi vẫn được giữ trên máy này.', 'Đăng xuất', function () {
    call('nvLogout', S.token); lsDel(AUTH_KEY); lsDel(BOOT_KEY); S.day = {}; S.dayAt = {}; S.token = null; S.cur = null; BG.length = 0; $('ca').style.display = 'none'; $('app').style.display = 'none'; showLogin('');
  });
}
var BOOT_KEY = 'nv9s_boot_v1';
function applyBoot(d) {
  S.user = d.username; S.role = d.role; S.readOnly = d.readOnly; S.store = d.store || ''; S.stores = d.stores || []; S.today = d.today; S.minNgay = d.minNgay;
  S.mapso = d.mapso || []; S.statuses = d.statuses || {}; S.build = d.build || '';
  if (!S.ngay || S.ngay > S.today || S.ngay < S.minNgay) S.ngay = S.today;
  $('tStore').textContent = S.store || '9 Sạch — Kết ca'; $('tSub').textContent = S.user + (S.readOnly ? ' · chỉ xem' : '');
}
function showApp() { $('splash').classList.add('hide'); $('app').style.display = 'block'; }
function dayBusy(n) { return (S.cur && S.cur.ngay === n) || BG.some(function (c) { return c.ngay === n; }); }
function boot(noCache) {
  var shown = false;
  if (!noCache && !S.adminStore && !S.store) {      // có bản lưu trên máy → hiện trang chủ NGAY (không chờ máy chủ)
    try {
      var o = JSON.parse(lsGet(BOOT_KEY) || 'null');
      if (o && o.user === S.user && o.d && o.d.role !== 'Admin' && o.d.role !== 'QuanLy') { applyBoot(o.d); showApp(); goTab(S.tab || 'home'); shown = true; }
    } catch (e) {}
  }
  if (!shown) busy(true, 'Đang tải…');
  call('nvBootstrap', S.token, S.adminStore || '').then(function (r) {
    busy(false); $('splash').classList.add('hide');
    if (!r.success) {
      if (r.code === 'EXPIRED' || !S.token) { showLogin(r.code === 'EXPIRED' ? '' : r.message); return; }
      if (shown) { toast('Chưa cập nhật được dữ liệu mới — đang dùng dữ liệu đã lưu trên máy.', true); return; }
      toast(r.message, true); showLogin(r.message); return;
    }
    var d = r.data; applyBoot(d);
    var days = d.days || {}; Object.keys(days).forEach(function (n) { if (!dayBusy(n)) { S.day[n] = days[n]; S.dayAt[n] = Date.now(); } });
    if (d.role !== 'Admin' && d.role !== 'QuanLy') lsSet(BOOT_KEY, JSON.stringify({ user: d.username, d: { username: d.username, role: d.role, readOnly: d.readOnly, store: d.store, stores: [], today: d.today, minNgay: d.minNgay, mapso: d.mapso, statuses: d.statuses, build: d.build } }));
    showApp();
    if (!S.cur) goTab(S.tab || 'home');
    ensureCatalog(); prefetch();
  });
}
function reloadAll() { S.day = {}; S.dayP = {}; S.dayAt = {}; boot(true); }
function init() {
  var a = lsGet(AUTH_KEY);
  if (a) { try { var o = JSON.parse(a); S.token = o.token; S.user = o.user; S.role = o.role; boot(); return; } catch (e) {} }
  showLogin('');
}

/* ---------- điều hướng chính ---------- */
function goTab(t) {
  S.tab = t;
  ['home', 'so', 'acc'].forEach(function (x) { $('v-' + x).classList.toggle('hide', x !== t); });
  Array.prototype.forEach.call(document.querySelectorAll('.nav button'), function (b) { b.classList.toggle('on', b.dataset.t === t); });
  if (t === 'home') renderHome(); else if (t === 'so') renderSo(); else renderAcc();
  window.scrollTo(0, 0);
}
var ST_LABEL = { Chua: ['Chưa làm', ''], Nhap: ['Đang nhập', 'y'], ChoDuyet: ['Chờ duyệt', 's'], DaDuyet: ['Đã duyệt', 'g'], TraLai: ['Bị trả lại', 'r'] };
function stOf(ngay, ca) { var d = S.statuses[ngay]; return (d && d[ca]) ? d[ca] : { status: 'Chua' }; }
function badgeHtml(st) { var l = ST_LABEL[st] || ST_LABEL.Chua; return '<span class="badge ' + l[1] + '">' + l[0] + '</span>'; }
function lastDays() { var o = []; for (var i = 0; i < 4; i++) o.push(addDays(S.today, -i)); return o; }

function renderHome() {
  var h = '';
  if (S.role === 'Admin') {
    h += '<div class="card"><h3><i class="fa-solid fa-store"></i>Cửa hàng (chế độ xem)</h3><select class="sel" onchange="adminPick(this.value)"><option value="">— Chọn cửa hàng —</option>' +
      S.stores.map(function (s) { return '<option value="' + esc(s) + '"' + (s === S.store ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>';
    if (!S.store) { $('v-home').innerHTML = h; return; }
  }
  // nhắc ca chưa kết
  var miss = [], hr = new Date().getHours();
  lastDays().reverse().forEach(function (n) {
    CA.forEach(function (ca) {
      if (n === S.today && (ca === 'Tối' || hr < 15)) return;
      var s = stOf(n, ca).status; if (s !== 'ChoDuyet' && s !== 'DaDuyet') miss.push(dm(n) + ' ' + ca);
    });
  });
  if (miss.length && !S.readOnly) h += '<div class="notice warn"><i class="fa-solid fa-triangle-exclamation"></i><div><b>Ca chưa kết:</b> ' + esc(miss.join(' · ')) + '.<br>Chọn ngày bên dưới để kết bù.</div></div>';
  h += '<div class="chips">' + lastDays().map(function (n, i) {
    return '<button class="chip' + (n === S.ngay ? ' on' : '') + '" onclick="pickNgay(\'' + n + '\')">' + (i === 0 ? 'Hôm nay' : i === 1 ? 'Hôm qua' : dm(n)) + '<small>' + dm(n) + '</small></button>';
  }).join('') + '</div>';
  CA.forEach(function (ca) {
    var st = stOf(S.ngay, ca), cls = ca === 'Sáng' ? 'sang' : 'toi', ic = ca === 'Sáng' ? 'fa-sun' : 'fa-moon';
    var sub = st.status === 'TraLai' && st.lyDo ? '<span class="red">Lý do: ' + esc(st.lyDo) + '</span>' : (st.status === 'Chua' ? 'Bấm để bắt đầu kết ca' : (st.status === 'Nhap' ? 'Bấm để nhập tiếp' : 'Bấm để xem'));
    h += '<button class="shift ' + cls + '" onclick="openCa(\'' + S.ngay + '\',\'' + ca + '\')"><div class="ico"><i class="fa-solid ' + ic + '"></i></div><div class="mid"><b>Ca ' + ca + '</b><span>' + sub + '</span></div>' + badgeHtml(st.status) + '<i class="fa-solid fa-chevron-right muted"></i></button>';
  });
  h += '<div class="tiny muted" style="text-align:center;margin-top:6px">Được kết bù tối đa 3 ngày. Sau khi gửi, ca bị khóa cho tới khi quản lý duyệt hoặc trả lại.</div>';
  $('v-home').innerHTML = h;
}
function pickNgay(n) { S.ngay = n; renderHome(); prefetch(); }
function adminPick(v) { S.adminStore = v; S.store = v; if (v) boot(); else renderHome(); }
function renderAcc() {
  $('v-acc').innerHTML = '<div class="card"><h3><i class="fa-solid fa-user"></i>Tài khoản</h3><div class="line"><div class="m"><b>' + esc(S.user) + '</b><span>' + (S.role === 'Admin' ? 'Admin (chỉ xem)' : 'Nhân viên') + '</span></div></div>' +
    '<div class="line"><div class="m"><b>Cửa hàng</b><span>' + esc(S.store || '—') + '</span></div></div><div class="line"><div class="m"><b>Phiên bản</b><span>' + esc(S.build) + '</span></div></div></div>' +
    '<button class="btn ghost block" style="margin-bottom:10px" onclick="clearDrafts()"><i class="fa-solid fa-broom"></i>Xóa bản nháp lưu trên máy</button>' +
    '<button class="btn red block" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i>Đăng xuất</button>';
}
function clearDrafts() {
  confirmBox('Xóa bản nháp trên máy?', 'Chỉ xóa bản sao lưu tạm trên điện thoại này. Dữ liệu đã lưu lên máy chủ không bị ảnh hưởng.', 'Xóa', function () {
    try { Object.keys(localStorage).forEach(function (k) { if (k.indexOf('nv9s_d:') === 0) localStorage.removeItem(k); }); } catch (e) {}
    toast('Đã xóa.');
  });
}

/* =====================================================================
   DANH MỤC SẢN PHẨM
   ===================================================================== */
function applyCatalog(items) { S.catalog = items; S.prices = {}; items.forEach(function (x) { S.prices[x[0]] = x[4]; }); }
function ensureCatalog() {
  if (!S.catalog) { try { var o = JSON.parse(lsGet('nv9s_cat2') || 'null'); if (o && o.items) { applyCatalog(o.items); S.catAt = o.at || 0; } } catch (e) {} }
  if (S.catalog && Date.now() - S.catAt < 20 * 60 * 1000) return Promise.resolve(true);
  var had = !!S.catalog;
  var p = call('nvGetCatalog', S.token).then(function (r) {
    if (r.success) { applyCatalog(r.data.items); S.catAt = Date.now(); lsSet('nv9s_cat2', JSON.stringify({ at: S.catAt, items: r.data.items })); if (S.cur && !S.cur.locked) { try { updateTotals(); } catch (e) {} } return true; }
    if (r.code === 'EXPIRED') handleExpired();
    return false;
  });
  return had ? Promise.resolve(true) : p;   // có bản cũ trên máy thì dùng ngay, tải bản mới ở nền
}
/* tải dữ liệu ngày — dùng bộ nhớ có sẵn (lấy luôn từ lần mở trang), chỉ gọi mạng khi thiếu; cũ thì làm mới Ở NỀN */
var STALE_MS = 120000;
function mergeDay(ngay, data, cas) {
  var d = S.day[ngay] || (S.day[ngay] = { ngay: ngay, ca: {}, opening: {}, extras: {} });
  cas.forEach(function (ca) {
    d.ca[ca] = data.ca[ca]; d.opening[ca] = data.opening[ca]; d.extras[ca] = data.extras[ca];
    if (data.ca[ca]) { var st = S.statuses[ngay] || (S.statuses[ngay] = {}); var cd = data.ca[ca]; st[ca] = { status: cd.status, lyDo: cd.lyDoTraLai || '' }; }
  });
  S.dayAt[ngay] = Date.now(); return d;
}
function refreshDay(ngay) {
  if (!S.token || !S.store) return Promise.resolve(null);
  if (S.dayBg[ngay]) return S.dayBg[ngay];
  var p = call('nvGetDay', S.token, ngay, S.store, CA).then(function (r) {
    delete S.dayBg[ngay];
    if (r.success && !dayBusy(ngay)) { mergeDay(ngay, r.data, CA); if (!S.cur) { if (S.tab === 'home') renderHome(); } }
    else if (!r.success && r.code === 'EXPIRED') handleExpired();
    return r.success ? S.day[ngay] : null;
  });
  S.dayBg[ngay] = p; return p;
}
function loadDay(ngay, cas) {
  var d = S.day[ngay] || (S.day[ngay] = { ngay: ngay, ca: {}, opening: {}, extras: {} });
  var miss = cas.filter(function (ca) { return !d.ca[ca]; });
  if (!miss.length) { if (Date.now() - (S.dayAt[ngay] || 0) > STALE_MS) refreshDay(ngay); return Promise.resolve(d); }
  var key = ngay + '|' + miss.join(',');
  if (S.dayP[key]) return S.dayP[key];
  var p = call('nvGetDay', S.token, ngay, S.store, miss).then(function (r) {
    delete S.dayP[key];
    if (!r.success) { if (r.code === 'EXPIRED') handleExpired(); else toast(r.message, true); return null; }
    return mergeDay(ngay, r.data, miss);
  });
  S.dayP[key] = p; return p;
}
function prefetch() { if (!S.store || S.readOnly) return; loadDay(S.ngay, CA); }

/* =====================================================================
   TÍNH TOÁN — PHẢI KHỚP calcDoc_ Ở Code.gs
   ===================================================================== */

  CkCaNhanBanh: 'CK Noti bánh — Kiot bấm tiền mặt', CkAcbShip: 'CK Noti — Ship (C, chi tiết)', ChiShipSi: 'Chi ship sỉ (C.Ty)', ChiShipLe: 'Chi ship lẻ', ChiShipTiktok: 'Chi ship Tiktok',
  ChiDienNuoc: 'Chi điện / nước / wifi', ChiKhac: 'Chi khác', ChiSuaChua: 'Chi sửa chữa (ngoài két)', CongTyChi: 'Công ty chi hộ (ngoài két)' };
var LOAI_HINT = { TmThuKhac: 'Thu tiền mặt ngoài Kiot → ô (I). Cộng vào két.', CkCaNhanThuKhac: 'Khách CK vào Noti cho khoản thu khác → ô (I).', TmBanhSale: 'Tiền mặt bán bánh sale → ô (I).',
  CkAcbBanhSale: 'Khách CK vào Noti cho bánh sale → ô (I).', CkCaNhanBanh: 'Khách CK vào Noti nhưng bill Kiot bấm TIỀN MẶT → trừ khỏi tiền mặt thực tế, không cộng doanh thu.',
  CkAcbShip: 'Tiền ship khách CK vào Noti (ô C). Chọn đúng loại ship, người trả và thời điểm.', ChiShipSi: 'Chi tiền mặt trả ship sỉ (công ty hỗ trợ) → cột CHI HỘ C.TY.', ChiShipLe: 'Chi tiền mặt trả ship lẻ → CHI C.HÀNG (hoặc C.Ty nếu công ty hỗ trợ).',
  ChiShipTiktok: 'Chi tiền mặt ship đơn Tiktok → cột CHI HỘ C.TY.', ChiDienNuoc: 'Chi điện, nước, wifi từ két → cột CHI HỘ C.TY.', ChiKhac: 'Chi khác từ két → CHI C.HÀNG. Bắt buộc ghi lý do.', ChiSuaChua: 'Chi sửa chữa (không trừ két).', CongTyChi: 'Công ty chi hộ cửa hàng (không trừ két).' };
var THU_LIST = ['TmThuKhac', 'CkCaNhanThuKhac', 'TmBanhSale', 'CkAcbBanhSale', 'CkCaNhanBanh', 'CkAcbShip'];
var CHI_LIST = ['ChiShipSi', 'ChiShipLe', 'ChiShipTiktok', 'ChiDienNuoc', 'ChiKhac', 'ChiSuaChua', 'CongTyChi'];
var IS_CHI = {}; CHI_LIST.forEach(function (k) { IS_CHI[k] = 1; });

function compressImage(file, maxW, q) {
  return new Promise(function (res, rej) {
    var fr = new FileReader();
    fr.onerror = rej;
    fr.onload = function () {
      var img = new Image(); img.onerror = rej;
      img.onload = function () {
        var w = img.width, h = img.height, k = Math.min(1, maxW / Math.max(w, h)); var cv = document.createElement('canvas'); cv.width = Math.round(w * k); cv.height = Math.round(h * k);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', q).split(',')[1]);
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function uploadPhoto(loai, done) {

      .then(function (r) { busy(false); if (r.success) { done(r.data.url); toast('Đã tải ảnh.'); } else if (r.code === 'EXPIRED') handleExpired(); else toast(r.message, true); })
      .catch(function () { busy(false); toast('Không xử lý được ảnh này. Thử chụp lại.', true); });

  inp.click();
}

<script>

    if (idx === -1) S.cur.rows.forEach(function (r, i) { if (idx === -1 && (r.items || []).indexOf(code) !== -1) idx = i; });
    out.push({ code: code, q: q, i: idx });

  return out;
}
function cbOpen() {

    cbFilter('');

}

  $('cbList').innerHTML = h || '<div class="sl-empty">Không thấy combo nào khớp. Combo phải có trong danh mục Kiot và có ít nhất 1 bánh nằm trong sổ.</div>';

  var cs = cbComps(x).filter(function (k) { return k.i >= 0; }); if (!cs.length) { toast('Combo này chưa có bánh nào trong sổ — báo quản lý.', true); return; }

    const t = new T.CanvasTexture(c); t.colorSpace = T.SRGBColorSpace; t.anisotropy = 4; track.push(t); texCache.set(k, t); return t;
  };
  const mat = (key, o) => { if (matCache.has(key)) return matCache.get(key); const m = new T.MeshStandardMaterial(o); track.push(m); matCache.set(key, m); return m; };
  const geo = (g) => { track.push(g); return g; };

}

function buildCake(T, X, it) {
  const kind = it.kind, col = flavorColor(it.name, kind), cream = '#fff3da';
  const g = new T.Group(), R = 0.5, Hh = kind === 'phusi' ? 0.62 : 0.5, cut = 0.95;
  const side = (c) => X.mat('s' + c + cream, { map: X.stripe(c, cream), roughness: 0.8 });
  const topOf = (c, rough) => X.mat('t' + c, { color: c, roughness: rough == null ? 0.55 : rough });
  const bottom = X.mat('bot', { color: '#e9dcc0', roughness: 0.9 });
  const add = (m, x, y, z) => { m.position.set(x, y, z); g.add(m); return m; };
  const sph = (r, mt, x, y, z, sy) => { const m = new T.Mesh(X.geo(new T.SphereGeometry(r, 10, 8)), mt); if (sy) m.scale.y = sy; return add(m, x, y, z); };

  if (kind === '3vi') {
    const trio = [col === KIND_BASE['3vi'] ? '#ec6f8d' : col, '#8fb35f', '#6a4130'];
    for (let k = 0; k < 3; k++) {
      const ge = X.geo(new T.CylinderGeometry(R, R, Hh, 40, 1, false, k * TAU / 3, TAU / 3 - 0.02));
      add(new T.Mesh(ge, [side(trio[k]), topOf('#' + X.shade(trio[k], 0.12).getHexString()), bottom]), 0, Hh / 2, 0);
    }
  } else if (kind === 'phusi') {
    const ge = X.geo(new T.CylinderGeometry(R * 0.36, R, Hh, 48, 1, false, 0, TAU));
    add(new T.Mesh(ge, [side(col), topOf('#fffaf0', 0.4), bottom]), 0, Hh / 2, 0);
    const snow = X.mat('snow', { color: '#ffffff', roughness: 0.35 });
    const cap = new T.Mesh(X.geo(new T.SphereGeometry(R * 0.4, 24, 10, 0, TAU, 0, Math.PI / 2)), snow); cap.scale.y = 0.7; add(cap, 0, Hh - 0.01, 0);
    for (let k = 0; k < 9; k++) { const a = k / 9 * TAU; sph(0.055, snow, Math.sin(a) * R * 0.38, Hh - 0.03, Math.cos(a) * R * 0.38, 1.2); }
  } else {
    const topC = kind === 'lava' ? '#4a2616' : kind === 'crepe' ? cream : '#' + X.shade(col, 0.1).getHexString();
    const ge = X.geo(new T.CylinderGeometry(R, R, Hh, 56, 1, false, cut / 2, TAU - cut));
    add(new T.Mesh(ge, [side(col), topOf(topC, kind === 'lava' ? 0.25 : 0.55), bottom]), 0, Hh / 2, 0);
    // hai mặt cắt thấy rõ từng lớp
    const pg = X.geo(new T.PlaneGeometry(R, Hh)), pm = X.mat('p' + col + cream, { map: X.stripe(col, cream), roughness: 0.8, side: T.DoubleSide });
    [cut / 2, -cut / 2].forEach((th) => { const p = new T.Mesh(pg, pm); p.rotation.y = th - Math.PI / 2; add(p, Math.sin(th) * R / 2, Hh / 2, Math.cos(th) * R / 2); });
    const free = (th) => Math.abs(Math.atan2(Math.sin(th), Math.cos(th))) > cut / 2 + 0.12;     // tránh vùng đã cắt
    if (kind === 'crepe') {
      const cm = X.mat('cream', { color: cream, roughness: 0.45 });
      for (let k = 0; k < 12; k++) { const a = k / 12 * TAU; if (free(a)) sph(0.06, cm, Math.sin(a) * R * 0.84, Hh + 0.02, Math.cos(a) * R * 0.84, 0.8); }
      sph(0.09, X.mat('berry', { color: '#c62839', roughness: 0.25 }), 0, Hh + 0.07, -0.12, 1.1);
    } else if (kind === 'lava') {
      const ch = X.mat('choc', { color: '#3b1d12', roughness: 0.25, metalness: 0.1 });
      for (let k = 0; k < 10; k++) {
        const a = k / 10 * TAU + 0.2; if (!free(a)) continue; const len = 0.1 + ((k * 37) % 10) / 10 * 0.22;
        add(new T.Mesh(X.geo(new T.CylinderGeometry(0.045, 0.045, len, 8)), ch), Math.sin(a) * (R + 0.008), Hh - len / 2, Math.cos(a) * (R + 0.008));
        sph(0.055, ch, Math.sin(a) * (R + 0.008), Hh - len, Math.cos(a) * (R + 0.008));
      }
      sph(0.15, X.mat('lava', { color: '#ff8a1f', emissive: '#ff5a00', emissiveIntensity: 0.75, roughness: 0.4 }), 0, Hh + 0.02, 0, 0.3);
    } else if (kind === 'truyenthong') {
      const dust = X.mat('dust', { color: '#f4ead2', roughness: 0.95 });
      for (let k = 0; k < 6; k++) { const a = k / 6 * TAU + 0.4; if (free(a)) sph(0.05, dust, Math.sin(a) * R * 0.55, Hh + 0.015, Math.cos(a) * R * 0.55, 0.6); }
    }
  }
  g.position.y = -Hh / 2;
  const obj = new T.Group(), spin = new T.Group(); spin.add(g); obj.add(spin); obj.spin = spin;
  return { obj, spin, hh: Hh / 2 };
}

/* ---------- tủ đông ---------- */
function buildFridge(T, track) {
  const W = 2.4, H = 3.2, D = 1.3, g = new T.Group();
  const M = (o) => { const m = new T.MeshStandardMaterial(o); track.push(m); return m; };
  const body = M({ color: '#f3efe4', roughness: 0.6 }), dark = M({ color: '#1d2623', roughness: 0.5, metalness: 0.3 }), green = M({ color: '#1f5a3a', roughness: 0.5 });
  const inner = M({ color: '#eaf4f8', roughness: 0.9, emissive: '#bfe3f5', emissiveIntensity: 0.35 });
  const glassShelf = M({ color: '#dff1ff', transparent: true, opacity: 0.45, roughness: 0.1 });
  const glassDoor = M({ color: '#cfe6ff', transparent: true, opacity: 0.16, roughness: 0.05, metalness: 0.1, depthWrite: false });
  const led = new T.MeshBasicMaterial({ color: '#d8ecff' }); track.push(led);
  const box = (w, h, d, m, x, y, z, p) => { const b = new T.Mesh(new T.BoxGeometry(w, h, d), m); track.push(b.geometry); b.position.set(x, y, z); (p || g).add(b); return b; };
  box(W - 0.16, H - 0.3, 0.05, inner, 0, 0.02, -D / 2 + 0.03);
  box(0.09, H, D, body, -W / 2 + 0.045, 0, 0); box(0.09, H, D, body, W / 2 - 0.045, 0, 0);
  box(W, 0.34, D, green, 0, H / 2 - 0.17, 0); box(W + 0.06, 0.2, D + 0.04, dark, 0, -H / 2 + 0.1, 0);
  box(W - 0.2, 0.045, 0.05, led, 0, H / 2 - 0.38, D / 2 - 0.12);
  const floor0 = -H / 2 + 0.2, gap = (H - 0.54) / 4, floors = [];
  for (let r = 0; r < 4; r++) { floors.push(floor0 + r * gap); if (r > 0) box(W - 0.2, 0.03, D - 0.12, glassShelf, 0, floor0 + r * gap - 0.015, 0); }
  const door = new T.Group(); door.position.set(-W / 2, 0, D / 2 + 0.02); g.add(door);
  box(W - 0.06, H - 0.5, 0.03, glassDoor, W / 2, -0.02, 0, door);
  box(W, 0.07, 0.06, dark, W / 2, H / 2 - 0.27, 0, door); box(W, 0.07, 0.06, dark, W / 2, -H / 2 + 0.24, 0, door);
  box(0.07, H - 0.4, 0.06, dark, 0.035, -0.02, 0, door); box(0.07, H - 0.4, 0.06, dark, W - 0.035, -0.02, 0, door);
  box(0.05, 1.1, 0.07, dark, W - 0.18, 0, 0.06, door);
  const pl = new T.PointLight('#d8ecff', 6, 6); pl.position.set(0, 0.4, D / 2 - 0.2); g.add(pl);
  return { group: g, door, W, H, D, floors, light: pl };
}

/* ---------- mount ---------- */
function mount(T, canvas, H) {
  const track = [], X = mkTools(T, track);
  const renderer = new T.WebGLRenderer({ canvas, antialias: true, alpha: true, powerPreference: 'high-performance' });
  renderer.setClearColor(0x000000, 0); renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
  const scene = new T.Scene(); scene.fog = new T.Fog(0xf6efdf, 300, 600);
  const cam = new T.PerspectiveCamera(CFG.fov, 1, 0.1, 100);
  const key = new T.DirectionalLight('#fff3dc', 2.6); key.position.set(3, 5, 4);
  const fill = new T.DirectionalLight('#cfe6ff', 0.9); fill.position.set(-4, 2, 3);
  scene.add(key, fill, new T.HemisphereLight(0xffffff, 0xe8dcc0, 1.1));
  const fr = buildFridge(T, track); scene.add(fr.group);
  const shTex = (() => { const c = document.createElement('canvas'); c.width = c.height = 64; const x = c.getContext('2d'); const gr = x.createRadialGradient(32, 32, 0, 32, 32, 32); gr.addColorStop(0, 'rgba(30,20,10,.55)'); gr.addColorStop(1, 'rgba(30,20,10,0)'); x.fillStyle = gr; x.fillRect(0, 0, 64, 64); const t = new T.CanvasTexture(c); track.push(t); return t; })();
  const shadow = new T.Mesh(new T.PlaneGeometry(1, 1), new T.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false, opacity: 0, fog: false }));
  shadow.rotation.x = -Math.PI / 2; scene.add(shadow); track.push(shadow.geometry, shadow.material);

  let its = [], N = 0, cur = 0, target = 0, lastIdx = -1, pT = 0, pS = 0, firstP = true, bump = 0, time = 0, dead = false, raf = 0, last = 0, snapT = 0;
  let dpr = Math.min(window.devicePixelRatio || 1, window.innerWidth < 768 ? CFG.maxDprMobile : CFG.maxDpr);
  renderer.setPixelRatio(dpr);
  const size = { w: 1, h: 1 }, hero = { pos: new T.Vector3(0, 0.1, 8), look: new T.Vector3() }, ring = { pos: new T.Vector3(), look: new T.Vector3(), near: 8, far: 20 };
  let met = { R: 4, tilt: 0.26, frontY: -1, frontZ: 3.8, mob: false, camDist: 5.8 };
  const fogC = new T.Color(0xf6efdf), fogT = new T.Color(0xf6efdf);
  const vA = new T.Vector3(), vB = new T.Vector3(), tmp = new T.Vector3(), tmp2 = new T.Vector3();

  function layout() {
    const w = Math.max(1, canvas.clientWidth), h = Math.max(1, canvas.clientHeight); size.w = w; size.h = h;
    renderer.setSize(w, h, false); cam.aspect = w / h;
    cam.fov = clamp(CFG.fov * Math.pow(CFG.refAspect / cam.aspect, 0.45), CFG.fovMin, CFG.fovMax); cam.updateProjectionMatrix();
    const tanH = Math.tan(T.MathUtils.degToRad(cam.fov / 2)), c = CFG.ring, mob = cam.aspect < 0.8;
    const dH = fr.H / (2 * CFG.fridgeFill * tanH), dW = fr.W / (2 * 0.86 * tanH * cam.aspect);
    hero.pos.set(0, 0.1, Math.max(dH, dW) + fr.D / 2);
    const R = mob ? c.radiusMobile : clamp(c.radius * cam.aspect / CFG.refAspect, c.rmin, c.rmax);
    met = { R, tilt: c.tilt, mob, camDist: mob ? c.camDistMobile : c.camDist, frontY: -R * Math.sin(c.tilt), frontZ: R * Math.cos(c.tilt) };
    ring.pos.set(0, met.frontY + c.camUp, met.frontZ + met.camDist); ring.look.set(0, met.frontY + c.lookDy, met.frontZ);
    ring.near = met.camDist + R * c.fogNear; ring.far = met.camDist + R * c.fogFar;
  }

  function clearItems() { its.forEach((it) => scene.remove(it.obj)); its = []; }
  function setItems(list) {
    clearItems(); N = list.length;
    const cols = Math.max(1, Math.min(4, Math.ceil(N / 4))), cellW = (fr.W - 0.4) / cols, sc = Math.min(0.42, cellW * 0.8);
    list.forEach((d, i) => {
      const b = buildCake(T, X, d); b.obj.userData.k = d.k; scene.add(b.obj);
      const row = i % 4, col = Math.floor(i / 4) % cols;
      const anchor = new T.Vector3((col - (cols - 1) / 2) * cellW, fr.floors[row] + 0.015 + b.hh * sc, 0.05);
      its.push({ k: d.k, obj: b.obj, spin: b.spin, hh: b.hh, anchor, base: sc, ph: i * 1.3 });
    });
    cur = target = Math.max(0, its.findIndex((x) => x.k === H.start)); if (cur < 0) cur = target = 0; lastIdx = target;
  }
  function setImage(k, url) {
    const it = its.find((x) => x.k === k); if (!it || !url || it.img === url) return; it.img = url;
    const im = new Image(); im.crossOrigin = 'anonymous';
    im.onload = () => {
      if (dead || it.card || !its.includes(it)) return;
      const iw = im.naturalWidth || 1, ih = im.naturalHeight || 1, kk = 1.15 / Math.max(iw, ih), w = iw * kk, h = ih * kk;
      const tex = new T.Texture(im); tex.needsUpdate = true; tex.colorSpace = T.SRGBColorSpace; tex.anisotropy = 4; track.push(tex);
      const card = new T.Group(), gb = new T.BoxGeometry(w + 0.08, h + 0.08, 0.04), gf = new T.PlaneGeometry(w, h);
      const mb = new T.MeshStandardMaterial({ color: '#fffaf0', roughness: 0.6 }), mf = new T.MeshBasicMaterial({ map: tex, toneMapped: false });
      track.push(gb, gf, mb, mf); const back = new T.Mesh(gb, mb), front = new T.Mesh(gf, mf); front.position.z = 0.025; card.add(back, front);
      it.spin.children[0].visible = false; it.spin.add(card); it.card = card; it.hh = h / 2; it.flat = true;
    };
    im.onerror = () => {}; im.src = url;
  }
  function report() {
    if (!N) return; const idx = clamp(Math.round(target), 0, N - 1);
    if (idx !== lastIdx) { lastIdx = idx; H.onFocus && H.onFocus(its[idx].k); }
  }

  /* ----- điều khiển: kéo / lăn ngang / chạm ----- */
  const ray = new T.Raycaster(), ndc = new T.Vector2(); let down = null;
  const onDown = (e) => { down = { x: e.clientX, y: e.clientY, t: target, moved: false }; };
  const onMove = (e) => {
    if (!down) return; const dx = e.clientX - down.x;
    if (Math.abs(dx) > 6) down.moved = true;
    if (down.moved && pT > 0.55) { target = clamp(down.t - dx / (size.w * CFG.ring.dragWidth), -0.3, N - 0.7); report(); }
  };
  const onUp = (e) => {
    if (!down) return; const d = down; down = null;
    if (d.moved) { target = clamp(Math.round(target), 0, Math.max(0, N - 1)); report(); return; }
    if (e.type === 'pointercancel') return;
    if (pT < 0.5) { H.onOpenReq && H.onOpenReq(); return; }
    const r = canvas.getBoundingClientRect(); ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
    ray.setFromCamera(ndc, cam); const hit = ray.intersectObjects(its.map((x) => x.obj), true)[0]; if (!hit) return;
    let o = hit.object; while (o && o.userData.k === undefined) o = o.parent; if (!o) return;
    const idx = its.findIndex((x) => x.k === o.userData.k);
    if (idx === Math.round(target)) H.onTap && H.onTap(o.userData.k); else { target = idx; report(); }
  };
  const onWheel = (e) => {
    if (pT < 0.55 || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
    target = clamp(target + e.deltaX / 240, 0, Math.max(0, N - 1)); report();
    clearTimeout(snapT); snapT = setTimeout(() => { target = clamp(Math.round(target), 0, Math.max(0, N - 1)); report(); }, CFG.ring.snapMs);
  };
  canvas.addEventListener('pointerdown', onDown); window.addEventListener('pointermove', onMove, { passive: true });
  window.addEventListener('pointerup', onUp); window.addEventListener('pointercancel', onUp); canvas.addEventListener('wheel', onWheel, { passive: true });
  const ro = typeof ResizeObserver !== 'undefined' ? new ResizeObserver(layout) : null; if (ro) ro.observe(canvas);

  /* ----- vòng lặp ----- */
  let fpsN = 0, fpsT = 0;
  function frame(now) {
    if (dead) return; if (!canvas.isConnected) { dispose(); return; }
    raf = requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now; time += dt;
    fpsN++; fpsT += dt; if (fpsT > 1.5) { if (fpsN / fpsT < CFG.targetFps && dpr > 1) { dpr = Math.max(1, dpr - 0.25); renderer.setPixelRatio(dpr); layout(); } fpsN = 0; fpsT = 0; }
    pS = firstP ? pT : damp(pS, pT, 10, dt); firstP = false; bump = damp(bump, 0, 7, dt);
    const c = CFG.ring, doorT = ease(seg(CFG.door[0], CFG.door[1], pS)), flyT = seg(CFG.fly[0], CFG.fly[1], pS), cb = ease(seg(CFG.cam[0], CFG.cam[1], pS)), outT = ease(seg(CFG.out[0], CFG.out[1], pS));
    cur = damp(cur, target, c.follow, dt);
    fr.door.rotation.y = -CFG.doorAngle * doorT; fr.group.position.z = -outT * 3; fr.group.scale.setScalar(1 - 0.15 * outT); fr.group.visible = outT < 0.995; fr.group.updateMatrixWorld(true);
    const step = N > 1 ? Math.min(TAU / N, 0.95) : 0, stag = N > 1 ? c.stagger / (N - 1) : 0, denom = Math.max(0.0001, 1 - (N - 1) * stag), mul = met.mob ? c.mobMul : 1;
    const act = clamp(Math.round(cur), 0, Math.max(0, N - 1));
    for (let i = 0; i < N; i++) {
      const it = its[i], a = (i - cur) * step, cosA = Math.cos(a), sz = cosA * met.R;
      vB.set(Math.sin(a) * met.R, -sz * Math.sin(met.tilt), sz * Math.cos(met.tilt));
      const focus = sstep(0.6, 1, cosA), rs = lerp(c.far, c.center, focus) * mul * (i === act ? 1 + 0.08 * bump : 1);
      const e = ease(clamp((flyT - i * stag) / denom, 0, 1)), arc = Math.sin(Math.PI * e);
      vA.copy(it.anchor); fr.group.localToWorld(vA);
      it.obj.position.lerpVectors(vA, vB, e); it.obj.position.z += arc * c.arc; it.obj.position.y += arc * 0.5 + Math.sin(time * 1.3 + it.ph) * c.bob * focus * e;
      it.obj.scale.setScalar(Math.max(0.0001, lerp(it.base * (1 - 0.15 * outT * (1 - e)), rs, e))); it.obj.visible = it.obj.scale.x > 0.001;
      it.spin.rotation.y = Math.sin(time * 0.6 + it.ph) * (it.flat ? 0.22 : 0.45) * e; it.spin.rotation.x = c.itemTilt * e;

    camP.z -= 0.25 * pS * (1 - cb); cam.position.copy(camP); cam.lookAt(camL);
    fogC.lerp(fogT, 1 - Math.exp(-6 * dt)); scene.fog.color.copy(fogC); scene.fog.near = lerp(300, ring.near, cb); scene.fog.far = lerp(600, ring.far, cb);
    const frac = Math.abs(cur - Math.round(cur)), cs = c.center * mul, hh = its[act] ? its[act].hh : 0.25;
    shadow.material.opacity = sstep(0.8, 1, flyT) * (1 - clamp(frac * 2.2, 0, 1)) * 0.5;
    shadow.position.set(0, met.frontY - hh * cs - 0.18, met.frontZ); shadow.scale.set(cs * 1.4, cs * 1.4, 1);

    canvas.removeEventListener('pointerdown', onDown); window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp); canvas.removeEventListener('wheel', onWheel); if (ro) ro.disconnect();

  }
  layout(); raf = requestAnimationFrame(frame);
  return {
    setItems, setImage, resize: layout, dispose,
    setProgress(p) { pT = clamp(p, 0, 1); },
    setIndex(k) { const i = its.findIndex((x) => x.k === k); if (i >= 0) { target = i; lastIdx = i; } },
    step(d) { target = clamp(Math.round(target) + d, 0, Math.max(0, N - 1)); report(); },
    pulse() { bump = 1; },
    setTint(hex) { try { fogT.set(hex); } catch (e) {} },
  };
}

window.V8MOD = { mount: mount, CFG: CFG };
